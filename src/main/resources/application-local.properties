spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_cloud_db
spring.datasource.username=ecommerce_user
spring.datasource.password=ecommerce_local_2026
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.health.db.enabled=true

# ============================================================
# SUPER ADMIN BOOTSTRAP
# Se alimenta mediante variables de entorno.
# No guardar contraseñas reales en Git.
# ============================================================
ecommerce.bootstrap.super-admin.username=${SUPER_ADMIN_USERNAME:}
ecommerce.bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD:}
ecommerce.bootstrap.super-admin.email=${SUPER_ADMIN_EMAIL:}
ecommerce.bootstrap.super-admin.name=${SUPER_ADMIN_NAME:Super Administrador}

# ============================================================
# PASSWORD RESET AND SMTP
# ============================================================
ecommerce.public-base-url=${ECOMMERCE_PUBLIC_BASE_URL:http://localhost:8080}
ecommerce.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

ecommerce.mail.enabled=${ECOMMERCE_MAIL_ENABLED:false}
ecommerce.mail.from=${ECOMMERCE_MAIL_FROM:no-reply@ecommercecloud.mx}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

