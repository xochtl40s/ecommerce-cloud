<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Acceso denegado | EComerce Cloud
    </title>

    <link rel="stylesheet"
          th:href="@{/css/auth-premium.css}">
</head>

<body>

<main class="error-page">

    <section class="error-card">

        <span class="error-code">403</span>

        <h1>No tienes acceso a esta sección</h1>

        <p>
            Tu cuenta no tiene los permisos necesarios
            o la sesión dejó de ser válida.
        </p>

        <div class="error-actions">

            <a class="login-button"
               th:href="@{/login}">
                Iniciar sesión
            </a>

            <a class="back-home"
               th:href="@{/}">
                Regresar al inicio
            </a>

        </div>

    </section>

</main>

</body>
</html>
