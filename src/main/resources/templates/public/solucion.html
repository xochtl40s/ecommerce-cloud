<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${
        vertical.productName
        + ' | EComerce Cloud'
    }">
        Solución
    </title>

    <link rel="stylesheet"
          th:href="@{/css/landing-premium.css}">
</head>

<body>

<header class="navbar">

    <a class="brand"
       th:href="@{/}">

        <span class="brand-logo">EC</span>

        <span class="brand-copy">
            <strong>EComerce Cloud</strong>
            <small>Una plataforma, múltiples negocios</small>
        </span>

    </a>

    <a class="button button-small"
       th:href="@{/super-admin/empresas/nueva}">
        Solicitar demostración
    </a>

</header>

<main class="solution-page">

    <a class="back-link"
       th:href="@{/#soluciones}">
        ← Regresar a soluciones
    </a>

    <section class="solution-hero">

        <span class="section-tag section-tag-dark"
              th:text="${vertical.code}">
            VERTICAL
        </span>

        <h1 th:text="${vertical.productName}">
            ProductCloud
        </h1>

        <h2 th:text="${vertical.commercialName}">
            Solución comercial
        </h2>

        <p th:text="${vertical.description}">
            Descripción.
        </p>

        <a class="button button-light"
           th:href="@{/super-admin/empresas/nueva}">
            Solicitar demostración
        </a>

    </section>

    <section class="section">

        <header class="section-header">

            <span class="section-tag">
                MÓDULOS INCLUIDOS
            </span>

            <h2>
                Funciones diseñadas para esta operación
            </h2>

        </header>

        <div class="benefits-grid">

            <article th:each="modulo : ${vertical.features}">

                <span th:text="${modulo.icon}">
                    🧩
                </span>

                <small th:text="${modulo.code}">
                    MODULO
                </small>

                <h3 th:text="${modulo.name}">
                    Módulo
                </h3>

                <p th:text="${modulo.description}">
                    Descripción.
                </p>

            </article>

        </div>

    </section>

</main>

</body>
</html>
